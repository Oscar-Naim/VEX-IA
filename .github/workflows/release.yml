name: Build and Release VEX Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag de versión (ej. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Compilar VEX.exe y Publicar Release
    runs-on: windows-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Instalar dependencias del sistema
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Compilar ejecutable con PyInstaller
        run: |
          pyinstaller --noconsole --onefile --name "VEX" --collect-data customtkinter --copy-metadata packaging main.py

      - name: Verificar ejecutable generado
        shell: bash
        run: |
          if [ -f "dist/VEX.exe" ]; then
            echo "Ejecutable dist/VEX.exe generado exitosamente."
            ls -lh dist/VEX.exe
          else
            echo "Error: dist/VEX.exe no fue encontrado."
            exit 1
          fi

      - name: Determinar tag de versión
        id: get_tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            if [ -z "$TAG" ]; then
              TAG="v1.0.0"
            fi
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Publicar GitHub Release con VEX.exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: "VEX HUD AI Desktop ${{ steps.get_tag.outputs.tag }}"
          files: dist/VEX.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
